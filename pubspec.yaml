name: wapari
description: Wapari - offline-first grain and commodity trading account book.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  google_mobile_ads: ^9.2.0
  nearby_connections: ^4.3.0
  permission_handler: ^12.0.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/hero_farm.png
    - assets/grain_sacks.png
