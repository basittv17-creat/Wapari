name: Wapari Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          flutter create --project-name wapari --platforms=android --org com.wapari.app /tmp/wapari_scaffold
          cp -R /tmp/wapari_scaffold/android ./android

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK only
        run: flutter build apk --release

      - name: Package APK into ZIP
        run: |
          mkdir -p dist
          zip -j dist/wapari-apk.zip build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: wapari-apk
          path: dist/wapari-apk.zip
          if-no-files-found: error
