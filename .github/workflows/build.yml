name: Wapari Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# ہر Run الگ رہے گا؛ نئی Push پہلے سے چلنے والا Run منسوخ نہیں کرے گی۔
concurrency:
  group: wapari-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android-apk:
    name: Analyze, test and build Android APK only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create --project-name wapari --platforms=android --org com.awasigogera /tmp/wapari_scaffold
          cp -R /tmp/wapari_scaffold/android ./android
          test -f android/gradlew
          test -f android/app/build.gradle.kts -o -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          perms = """
              <uses-permission android:maxSdkVersion="31" android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:maxSdkVersion="31" android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:maxSdkVersion="30" android:name="android.permission.BLUETOOTH" />
              <uses-permission android:maxSdkVersion="30" android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:maxSdkVersion="28" android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:minSdkVersion="29" android:maxSdkVersion="31" android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:minSdkVersion="31" android:name="android.permission.BLUETOOTH_ADVERTISE" />
              <uses-permission android:minSdkVersion="31" android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:minSdkVersion="31" android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:minSdkVersion="32" android:name="android.permission.NEARBY_WIFI_DEVICES" />
          """
          if "android.permission.BLUETOOTH_SCAN" not in s:
              s = s.replace("<application", perms + "\\n        <application", 1)
              p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          marker = "<application"
          start = content.find(marker)
          if start < 0:
              raise SystemExit("AndroidManifest.xml has no <application> element")
          end = content.find(">", start)
          if end < 0:
              raise SystemExit("AndroidManifest.xml has a malformed <application> element")
          metadata = '''
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-9214971554658897~1877169274" />'''
          if "com.google.android.gms.ads.APPLICATION_ID" not in content:
              content = content[:end + 1] + metadata + content[end + 1:]
              manifest.write_text(content)
          PY

      # Cache downloaded Gradle dependencies across workflow runs. The key follows
      # the generated Android Gradle configuration and Dart dependency manifest.
      - name: Add R8 keep rule for WorkManager Room database
        run: |
          cat > android/app/proguard-rules.pro <<'EOF'
          # WorkManager loads its Room database implementation reflectively.
          # Preserve the no-argument constructor when Flutter's release R8 shrinking is enabled.
          -keep class * extends androidx.room.RoomDatabase { <init>(); }
          EOF

      - name: Restore Gradle dependency cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-4
            ~/.gradle/wrapper
          key: ${{ runner.os }}-wapari-gradle-${{ hashFiles('android/**/gradle-wrapper.properties', 'android/build.gradle*', 'android/app/build.gradle*', 'pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-wapari-gradle-

      - name: Verify required project assets
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f assets/hero_farm.png
          test -f assets/grain_sacks.png
          test -f test/trade_account_test.dart

      - name: Install Flutter dependencies
        run: flutter pub get

      # Maven Central returned HTTP 403 for the printing plugin's Android
      # buildscript dependencies. Prefer Google's synchronized Central mirror,
      # while keeping Maven Central as a fallback.
      - name: Add Maven Central mirror for printing Android plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import glob
          matches = glob.glob(str(Path.home() / ".pub-cache/hosted/pub.dev/printing-*/android/build.gradle"))
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one resolved printing Android build file, found: {matches}")
          path = Path(matches[0])
          source = path.read_text()
          original = """repositories {
                  google()
                  mavenCentral()
              }"""
          replacement = """repositories {
                  google()
                  maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
                  mavenCentral()
              }"""
          count = source.count(original)
          if count != 2:
              raise SystemExit(f"Expected 2 printing repository blocks, found {count}; refusing to patch")
          path.write_text(source.replace(original, replacement))
          print(f"Configured Maven Central mirror in {path}")
          PY

      - name: Format Dart source
        run: dart format lib test

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Build Android release APK only
        run: flutter build apk --release --dart-define=ADMOB_TEST_ADS=true

      # Save dependency downloads before freeing disk space for the emulator.
      - name: Save Gradle dependency cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-4
            ~/.gradle/wrapper
          key: ${{ runner.os }}-wapari-gradle-${{ hashFiles('android/**/gradle-wrapper.properties', 'android/build.gradle*', 'android/app/build.gradle*', 'pubspec.yaml') }}

      - name: Verify APK application ID
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          PACKAGE_ID="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")"
          echo "APK application ID: $PACKAGE_ID"
          test "$PACKAGE_ID" = "com.awasigogera.wapari"

      - name: Free disk space for Android emulator
        run: |
          echo "Disk space before cleanup:"
          df -h /
          # These build-only toolchains are no longer needed after the APK is built.
          rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake"
          # Gradle dependency caches have already been saved above. Keep the
          # Flutter pub cache intact so setup-flutter can persist/reuse it.
          rm -rf "$HOME/.gradle/daemon"
          echo "Disk space after cleanup:"
          df -h /

      # Resolve sdkmanager from the Android SDK installation; setup-flutter does
      # not guarantee that its cmdline-tools directory is on PATH.
      # Retry the network-sensitive emulator download to tolerate transient SDK failures.
      - name: Preinstall Android emulator with download retries
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for candidate in "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager "$ANDROID_HOME"/tools/bin/sdkmanager; do
              if [ -x "$candidate" ]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Could not find sdkmanager under ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          echo "Using Android SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          for attempt in 1 2 3 4; do
            echo "Installing Android emulator package (attempt $attempt/4)..."
            if "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install emulator --channel=0 && test -x "$ANDROID_HOME/emulator/emulator"; then
              echo "Android emulator package is installed."
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 20))
              echo "SDK download failed; retrying in ${delay}s..."
              sleep "$delay"
            fi
          done
          echo "::error::Android emulator package could not be installed after 4 attempts."
          exit 1

      - name: Android emulator launch and crash-log test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          script: bash .github/scripts/android-emulator-smoke-test.sh

      - name: Create ZIP of fatal crash logs
        if: always()
        run: |
          if [ -s diagnostics/fatal-crash-logs.txt ]; then
            zip -j diagnostics/fatal-crash-logs.zip diagnostics/fatal-crash-logs.txt
            unzip -l diagnostics/fatal-crash-logs.zip
          else
            echo "No fatal crash log file exists; ZIP will not be created."
          fi

      - name: Upload fatal crash log text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fatal-crash-logs-text
          path: diagnostics/fatal-crash-logs.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload fatal crash logs ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fatal-crash-logs-zip
          path: diagnostics/fatal-crash-logs.zip
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify and package APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          zip -j dist/wapari-apk.zip build/app/outputs/flutter-apk/app-release.apk
          unzip -l dist/wapari-apk.zip

      - name: Upload APK ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: wapari-apk
          path: dist/wapari-apk.zip
          if-no-files-found: error
          retention-days: 14
